# .github/workflows/ping.yml
name: Ping

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start-ping]

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update marker
        run: |
          echo "PING: $(date -u +'%H:%M:%S')" >> marker.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marker.txt
          git commit -m "ping $(date +%s)" || exit 0
          git push

      - name: Trigger Pong
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: start-pong
