# .github/workflows/pong.yml
name: Pong

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start-pong]

permissions:
  contents: write

jobs:
  pong:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update marker
        run: |
          echo "PONG: $(date -u +'%H:%M:%S')" >> marker.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marker.txt
          git commit -m "pong $(date +%s)" || exit 0
          git push

      - name: Trigger Ping
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: start-ping
