# .github/workflows/update.yml
name: Keep Alive

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start-loop]

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flip marker
        run: |
          if grep -q "FLIP" marker.txt 2>/dev/null; then
            sed -i 's/FLIP.*/FLIP: $(shuf -n1 -e x o z a b c)/' marker.txt
          else
            echo "FLIP: $(shuf -n1 -e x o z a b c)" >> marker.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marker.txt
          git commit -m "flip $(date +%s)" || exit 0
          git push

      - name: Loop forever (trigger ping)
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: ping
