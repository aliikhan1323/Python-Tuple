# .github/workflows/update.yml
name: Infinite Keep Alive

on:
  schedule:
    - cron: '*/1 * * * *'  # Every minute → 2 updates per minute
  workflow_dispatch:

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # === UPDATE 1: Add timestamp ===
      - name: Update 1 - Add timestamp
        run: |
          echo "PING: $(date -u +'%H:%M:%S')" >> marker.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marker.txt
          git commit -m "ping $(date +%s)" || exit 0
          git push

      # === WAIT 30 SECONDS ===
      - name: Wait 30 seconds
        run: sleep 30

      # === UPDATE 2: Remove last line ===
      - name: Update 2 - Remove last line
        run: |
          sed -i '$ d' marker.txt
          git add marker.txt
          git commit -m "pong $(date +%s)" || exit 0
          git push
