# .github/workflows/update.yml
name: Infinite Keep Alive

on:
  workflow_dispatch:
  schedule:
    - cron: '*/1 * * * *'  # Backup every minute

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # === STEP 1: Add random letter ===
      - name: Add random letter
        id: add
        run: |
          LETTER=$(shuf -n 1 -e x o z a b c d e f)
          echo "$LETTER" >> marker.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marker.txt
          git commit -m "add: $LETTER" || exit 0
          git push
          echo "letter=$LETTER" >> $GITHUB_OUTPUT

      # === STEP 2: Wait 5 seconds ===
      - name: Wait 5 seconds
        run: sleep 5

      # === STEP 3: Remove last letter ===
      - name: Remove last letter
        run: |
          sed -i '$ d' marker.txt
          git add marker.txt
          git commit -m "remove: last letter" || exit 0
          git push

      # === STEP 4: Wait 5 seconds ===
      - name: Wait 5 seconds again
        run: sleep 5

      # === STEP 5: Repeat forever (re-run workflow) ===
      - name: Retrigger self
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Infinite Keep Alive
          ref: main
