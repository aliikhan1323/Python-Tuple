# .github/workflows/trigger.yml
name: Ping

on:
  repository_dispatch:
    types: [ping]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Keep Alive
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Keep Alive
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
