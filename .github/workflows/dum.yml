# .github/workflows/update.yml
name: Keep Alive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Backup every hour

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README
        run: |
          echo "" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: keep alive" || exit 0
          git push

      - name: Retrigger in ~30 sec
        if: success()
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Keep Alive
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
